<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Day 1 Demo · The Jollof Kitchen</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>🍛 The Jollof Kitchen</h1>
    <p class="subtitle">Callbacks → Promises → async/await</p>

    <div class="buttons">
      <button id="btn-sync">0. Sync vs Async</button>
      <button id="btn-callbacks">1. Callbacks</button>
      <button id="btn-promises">2. Promises</button>
      <button id="btn-async">3. async/await</button>
      <button id="btn-fail" class="danger">4. Out of rice (error)</button>
      <button id="btn-all" class="accent">5. Promise.all</button>
      <button id="btn-clear" class="ghost">Clear log</button>
    </div>

    <ul id="log" class="log"></ul>
  </main>

  <!-- Switch to demo-finished.js to show the completed version -->
  <script src="demo-start.js"></script>
</body>
</html>
