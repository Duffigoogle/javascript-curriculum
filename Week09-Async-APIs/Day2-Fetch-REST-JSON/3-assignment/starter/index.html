<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recipe Finder</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <h1>🍲 Recipe Finder</h1>
    <p>Search thousands of recipes from around the world</p>

    <form id="search-form" class="search">
      <input id="search-input" type="text" placeholder="e.g. rice, chicken, soup" required />
      <button type="submit">Search</button>
      <button type="button" id="random-btn" class="secondary">🎲 Surprise me</button>
    </form>

    <!-- Stretch: category chips go here -->
    <div id="categories" class="chips"></div>
  </header>

  <main class="container">
    <p id="status" class="status"></p>
    <div id="results" class="grid"></div>

    <!-- Details view (hidden until a card is clicked) -->
    <section id="details" class="details hidden"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
