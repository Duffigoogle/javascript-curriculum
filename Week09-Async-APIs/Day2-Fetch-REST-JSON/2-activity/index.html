<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Day 2 Activity · Mood Booster</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>😄 The Mood Booster</h1>
    <button id="boost-btn" class="boost">🚀 Boost me! (all three)</button>

    <div class="cards">
      <section class="card">
        <h2>😂 Joke</h2>
        <div id="joke-text" class="text">Click for a joke</div>
        <button id="joke-btn">New joke</button>
      </section>

      <section class="card">
        <h2>💡 Advice</h2>
        <div id="advice-text" class="text">Click for advice</div>
        <button id="advice-btn">New advice</button>
      </section>

      <section class="card">
        <h2>🐱 Cat fact</h2>
        <div id="cat-text" class="text">Click for a cat fact</div>
        <button id="cat-btn">New fact</button>
      </section>
    </div>
  </main>

  <script src="activity.js"></script>
</body>
</html>
